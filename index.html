<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pokémon Aurora</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <a href="#home" class="logo">
            <span>POKÉMON</span>
            <strong>AURORA</strong>
        </a>

        <nav id="mainNav">

            <a href="#home" data-i18n="nav_home">
                Início
            </a>

            <a href="#game" data-i18n="nav_game">
                Jogo
            </a>

            <a href="#pokedex" data-i18n="nav_pokedex">
                Pokédex
            </a>

            <a href="#shop" data-i18n="nav_shop">
                Loja
            </a>

            <a href="#battlepass" data-i18n="nav_pass">
                Battle Pass
            </a>

        </nav>

        <div class="nav-actions">

            <!-- IDIOMA -->

            <button
                id="languageButton"
                class="small-button"
                type="button"
            >
                🇵🇹 PT
            </button>

            <!-- MOEDA -->

            <button
                id="currencyButton"
                class="small-button"
                type="button"
            >
                € EUR
            </button>

            <!-- ROBLOX -->

            <button
                id="loginButton"
                class="login-button"
                type="button"
                data-i18n="login"
            >
                Entrar com Roblox
            </button>

            <!-- MENU MOBILE -->

            <button
                id="mobileMenuButton"
                class="mobile-menu-button"
                type="button"
                aria-label="Abrir menu"
            >
                ☰
            </button>

        </div>

    </header>
